# Jenkins CI lab: a Jenkins controller configured entirely as code, plus a PostgreSQL for integration tests.
#   cp .env.example .env   (set a password)
#   docker compose up -d --build
#   open http://localhost:8090
name: jenkins-ci-lab

services:
  jenkins:
    build: ./jenkins
    container_name: jenkins # pipelines mount this container's workspace with --volumes-from jenkins
    restart: unless-stopped
    # Root so Jenkins can use the Docker socket without group juggling. Fine for a local lab only (see README).
    user: root
    ports:
      - "8090:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx1g
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc:/usr/share/jenkins/casc:ro
      - ./jobs:/usr/share/jenkins/jobs:ro
    depends_on:
      ci-postgres:
        condition: service_healthy

  # Shared database server for integration tests. Each build creates and drops its own database.
  ci-postgres:
    image: postgres:17-alpine
    container_name: ci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    tmpfs:
      - /var/lib/postgresql/data # test data only; kept in memory and gone on restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Webhook relay (optional): GitHub can't reach localhost, so this client listens on a public
  # smee.io channel and forwards each push event to Jenkins' git notifyCommit endpoint, which
  # triggers branch indexing right away instead of waiting for the 5-minute scan.
  # Enabled by COMPOSE_PROFILES=webhook in .env. See "Webhooks" in the README.
  smee:
    image: node:22-alpine
    container_name: smee
    restart: unless-stopped
    profiles: [webhook]
    # List form: no shell parsing, so the "&" between the query parameters is kept as-is
    command:
      - npx
      - --yes
      - smee-client
      - --url
      - ${SMEE_URL}
      - --target
      - http://jenkins:8080/git/notifyCommit?url=${WEBHOOK_REPO_URL}&token=${NOTIFY_COMMIT_TOKEN}
    depends_on:
      - jenkins

networks:
  default:
    name: ci-lab # build containers join this network to reach ci-postgres

volumes:
  jenkins_home:
