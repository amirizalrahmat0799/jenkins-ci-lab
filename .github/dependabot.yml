# Weekly dependency updates, grouped into one PR per ecosystem so CI checks them together.
# Major upgrades (e.g. Spring Boot 4, a new Node or Java base image) are ignored here and done deliberately by hand.
# Bumps the pinned Jenkins LTS image; plugins in plugins.txt are updated from the Jenkins UI or by hand.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/jenkins"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      jenkins-image:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
